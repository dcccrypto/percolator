name: CI

# Restored 2026-08-27. `main` branch protection requires four status checks —
# test, clippy, fmt, "Kani Proofs" — but this repo had NO .github/workflows at all, so none
# of them could ever report and every PR to main was permanently unmergeable. The last
# workflow run was 2026-04-18.
#
# The job NAMES below are chosen to match those required contexts exactly. Renaming a job
# here silently re-blocks every PR, so don't.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      # --no-fail-fast matters: without it cargo stops at the first failing SUITE and the
      # totals it prints are a truncated subset. That has produced wrong pass/fail numbers
      # in this project before.
      - name: Test
        run: cargo test --no-fail-fast --verbose

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -W, not -D: the crate currently has ~57 warnings. Making them errors would fail every
      # PR for pre-existing debt rather than for anything the PR did.
      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::all

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # SCOPED TO THE FILES THIS PR TOUCHES, deliberately.
      #
      # `cargo fmt --check` over the whole repo fails today: there are 243 diff hunks,
      # including src/v16.rs. Reformatting them is NOT deployment-neutral — measured
      # 2026-08-27, running `cargo fmt` changed the compiled wrapper .so from 2e88fb83… to
      # 9f25ac81…, because release builds embed file/line in panic paths. So a repo-wide
      # reformat has to be sequenced deliberately against a deploy, not smuggled in with a
      # CI restoration.
      #
      # Checking only changed files still enforces the property that matters right now — no
      # NEW drift — and reports honestly instead of being permanently red. Switch this to a
      # whole-repo `cargo fmt --check` once the reformat has landed.
      - name: Check formatting of changed files
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "not a pull_request event — checking the last commit's files"
            BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.rs' || true)
          if [ -z "$FILES" ]; then
            echo "no Rust files changed — nothing to check"
            exit 0
          fi
          echo "checking:"; echo "$FILES" | sed 's/^/  /'
          # shellcheck disable=SC2086
          rustfmt --edition 2021 --check $FILES

  kani:
    name: Kani Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A BOUNDED subset, not the full suite. All 240 harnesses take hours, which is exactly
      # why Kani was pulled from CI in the first place (commit 47a39e76, "too slow for every
      # commit"). Running nothing was the wrong correction: it left "Kani Proofs" as a
      # required check that could never report.
      #
      # The harnesses below are non-vacuous on main TODAY and are the FASTEST in the suite
      # (1-2s each, measured), so this job reports honestly and finishes.
      #
      # Harness choice is a resource decision, not a taste one. A hosted runner was killed
      # mid-check ("The runner has received a shutdown signal") on a heavier harness -- CBMC
      # is memory-hungry and the historical Kani workflow used a larger blacksmith runner.
      # --jobs 1 keeps the peak down.
      #
      # The two that were VACUOUS until 2026-08-26 —
      # proof_v16_reset_empty_asset_oracle_anchor_is_value_neutral_and_idle_gated and
      # proof_v16_public_backing_fee_charges_only_selected_domain — are repaired in #147, not
      # on main. Add them to this list once #147 lands; running them before that would fail
      # this job for a defect the PR does not contain.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Verify repaired harnesses
        run: |
          set -euo pipefail
          for H in \
            proof_v16_asset_recovery_transition_freezes_price_and_bumps_once \
            proof_v17_lp_vault_cooldown_enforcement
          do
            echo "=== $H ==="
            # --features fuzz is REQUIRED: `--tests` builds every test target, and the
            # v16_fuzzing target is feature-gated. Without it cargo aborts with
            # "target v16_fuzzing ... requires the features: fuzz" before any proof runs.
            cargo kani --tests --features fuzz --jobs 1 --harness "$H" --output-format terse | tee "/tmp/$H.log"
            # A pass is not enough. Kani reports SUCCESSFUL for a harness whose covers are
            # unreachable, which is precisely how these two hid. Gate on the cover line.
            if grep -qE "0 of [0-9]+ cover properties satisfied" "/tmp/$H.log"; then
              echo "::error::$H is VACUOUS — cover properties unreachable"
              exit 1
            fi
          done
